<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1"> 
    <title>What do you like about me?</title>
    <link rel="stylesheet" href="Opinion.css">
</head>

<body>

<div class="container">

    <!-- LEFT TEXT -->
    <div class="left-side">
        <h2>What do you think of me?</h2>
    </div>

    <!-- RIGHT CHATBOX -->
    <div class="right-side">
        <textarea id="message" placeholder="Write your thoughts about me here..."></textarea>
        <button id="submit">Submit</button>

        <!-- Optional Name Section (hidden initially) -->
        <div id="name-section" class="hidden">
            <div class="name-input-wrapper">
                <input type="text" id="name" placeholder="Your name (optional)">
                <button id="send-btn" type="submit">▶</button>
            </div>
        </div>

        <div id="response"></div>
    </div>

</div>


    <script src="Opinion.js"></script>

</body>
</html>
